[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ronlang"
version = "1.0.0rc1"
description = "Readable web prototyping language with English and Spanish syntax"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
ron = "roncli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools]
py-modules = ["ron", "roncli", "ronlib", "rondata", "ronfiles", "ronsecurity", "ronstarter"]
